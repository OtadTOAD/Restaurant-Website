<section class="content-section">
  <div class="menu-grid">
    @for (type of menuTypes; track type.slug) {
    <div class="menu-item scale-in" [style.transition-delay]="$index * 0.06 + 's'">
      <img class="icon" [src]="type.icon" [alt]="type.label | transloco">
      <h3>{{ type.label | transloco }}</h3>
      <button class="menu-btn" [routerLink]="['/products', type.slug]">{{ "EXPLORE" | transloco }}</button>
    </div>
    }
  </div>
</section>
